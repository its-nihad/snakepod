<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnakePod — Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --chassis-1: #fffaf0;
    --chassis-2: #f2ead4;
    --chassis-edge: #e4d8b8;
    --brass: #4f9a4a;
    --brass-bright: #5cae52;
    --brass-dim: #357a34;
    --glass-bg-1: #f3fbe9;
    --glass-bg-2: #e2f2d0;
    --neon: #2f7a2a;
    --neon-dim: #bfe3ab;
    --food: #d6483f;
    --text-warm: #3a3226;
    --text-dim: #8a7f63;
    --key-1: #fffdf6;
    --key-2: #eee3c6;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100vh; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% -10%, #e8f4d8 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, #d9ecc4 0%, transparent 60%),
      #f6f2e4;
    font-family: 'Nunito', sans-serif;
    padding: 24px;
  }

  .cabinet {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(155deg, var(--chassis-1) 0%, var(--chassis-2) 65%);
    border-radius: 24px;
    padding: 20px 20px 24px;
    position: relative;
    box-shadow:
      0 30px 60px -20px rgba(120,110,80,0.35),
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 -8px 16px rgba(0,0,0,0.06) inset,
      0 0 0 1px var(--chassis-edge);
  }

  .cabinet::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(155deg, rgba(255,255,255,0.10), transparent 30%, transparent 70%, rgba(255,255,255,0.04));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .brand {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 2px 4px 14px;
  }

  .brand-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 1px;
    color: var(--brass-dim);
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  .brand-model {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
  }

  .screen-housing {
    background: var(--chassis-2);
    border-radius: 12px;
    padding: 3px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5) inset, 0 0 0 1px rgba(201,167,106,0.15);
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 6px 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .hud-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    display: block;
  }

  .hud-value {
    font-size: 17px;
    color: var(--neon);
    text-shadow: 0 0 8px rgba(47,122,42,0.25);
  }

  .screen {
    background: linear-gradient(165deg, var(--glass-bg-1), var(--glass-bg-2));
    border-radius: 9px;
    padding: 10px;
    position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5) inset;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 4px;
    background: transparent;
  }

  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(255,251,240,0.92);
    text-align: center;
    padding: 20px;
  }

  .overlay.hidden { display: none; }

  .overlay-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--brass-dim);
  }

  .overlay-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-warm);
    letter-spacing: 1px;
  }

  .overlay-btn {
    margin-top: 6px;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    color: #241d10;
    background: linear-gradient(180deg, var(--brass-bright), var(--brass-dim));
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.4), 0 5px 10px rgba(201,167,106,0.25);
  }
  .overlay-btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    max-width: 190px;
    margin: 20px auto 0;
  }

  .dpad button {
    appearance: none;
    border: none;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--key-1), var(--key-2));
    color: var(--text-warm);
    font-size: 16px;
    padding: 14px 0;
    cursor: pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 3px 0 rgba(0,0,0,0.5),
      0 5px 8px rgba(0,0,0,0.3),
      0 0 0 1px rgba(201,167,106,0.12);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.05s ease;
  }
  .dpad button:active, .dpad button.pressed {
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3), 0 0 0 1px rgba(201,167,106,0.12);
  }

  .dpad-up { grid-column: 2; grid-row: 1; }
  .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-center { grid-column: 2; grid-row: 2; background: linear-gradient(180deg, #fdf3d8, #eadfb8) !important; color: var(--brass-dim) !important; font-size: 11px; letter-spacing: 1px; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 3; }

  .hint {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-top: 14px;
  }

  @media (max-width: 380px) {
    .brand-name { font-size: 18px; }
    .hud-value { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <div class="brand">
    <span class="brand-name">SnakePod</span>
    <span class="brand-model">SNK-01</span>
  </div>

  <div class="hud">
    <div>
      <span class="hud-label">SCORE</span>
      <span class="hud-value" id="score">0</span>
    </div>
    <div style="text-align:right;">
      <span class="hud-label">BEST</span>
      <span class="hud-value" id="best">0</span>
    </div>
  </div>

  <div class="screen-housing">
    <div class="screen">
      <canvas id="game" width="400" height="480"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title">SnakePod</div>
        <div class="overlay-sub" id="overlay-msg">Press start or use arrow keys</div>
        <button class="overlay-btn" id="startBtn">Start</button>
      </div>
    </div>
  </div>

  <div class="dpad">
    <button class="dpad-up" data-dir="up">▲</button>
    <button class="dpad-left" data-dir="left">◀</button>
    <button class="dpad-center" id="pauseBtn">⏸</button>
    <button class="dpad-right" data-dir="right">▶</button>
    <button class="dpad-down" data-dir="down">▼</button>
  </div>

  <div class="hint">ARROW KEYS / WASD · SPACE TO PAUSE</div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  const CELL = 20;
  const GRID_X = canvas.width / CELL;
  const GRID_Y = canvas.height / CELL;

  const COLOR_FOOD = '#d6483f';
  const COLOR_GRID = 'rgba(126,224,138,0.05)';
  let frame = 0;

  let snake, dir, nextDir, food, score, best, running, paused, loopId, speed;

  best = parseInt(localStorage.getItem('snakepod-best') || '0', 10);
  bestEl.textContent = best;

  function resetState() {
    const startY = Math.floor(GRID_Y / 2);
    snake = [{x: 8, y: startY}, {x: 7, y: startY}, {x: 6, y: startY}, {x: 5, y: startY}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 130;
    frame = 0;
    placeFood();
    scoreEl.textContent = score;
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food = { x: Math.floor(Math.random() * GRID_X), y: Math.floor(Math.random() * GRID_Y) };
      valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function drawGrid() {
    ctx.strokeStyle = COLOR_GRID;
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_X; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
    }
    for (let j = 0; j <= GRID_Y; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * CELL);
      ctx.lineTo(canvas.width, j * CELL);
      ctx.stroke();
    }
  }

  function cx(g) { return g.x * CELL + CELL / 2; }
  function cy(g) { return g.y * CELL + CELL / 2; }

  function drawFood() {
    const x = cx(food), y = cy(food);
    ctx.save();
    ctx.shadowColor = COLOR_FOOD;
    ctx.shadowBlur = 14;
    const grad = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, CELL * 0.42);
    grad.addColorStop(0, '#f18a7f');
    grad.addColorStop(0.6, COLOR_FOOD);
    grad.addColorStop(1, '#8a2e26');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, CELL * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // little leaf
    ctx.fillStyle = '#6fae4a';
    ctx.beginPath();
    ctx.ellipse(x + 3, y - CELL * 0.36, 3.5, 2, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function segAngle(i) {
    const a = snake[Math.max(i - 1, 0)];
    const b = snake[Math.min(i + 1, snake.length - 1)];
    return Math.atan2(cy(b) - cy(a), cx(b) - cx(a));
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawFood();

    const n = snake.length;

    // body: tapered capsules from tail to neck, widest near head
    for (let i = n - 1; i >= 1; i--) {
      const seg = snake[i];
      const x = cx(seg), y = cy(seg);
      const t = 1 - i / n; // 0 at tail, ~1 near head
      const radius = CELL * (0.24 + 0.16 * t);
      const angle = segAngle(i);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const grad = ctx.createLinearGradient(0, -radius, 0, radius);
      const light = `hsl(${100 + t * 15}, 42%, ${34 + t * 8}%)`;
      const dark = `hsl(${100 + t * 15}, 40%, ${16 + t * 4}%)`;
      grad.addColorStop(0, light);
      grad.addColorStop(1, dark);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, radius * 1.15, radius, 0, 0, Math.PI * 2);
      ctx.fill();

      // scale highlight
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.beginPath();
        ctx.ellipse(-radius * 0.2, -radius * 0.35, radius * 0.4, radius * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // belly stripe along body
    ctx.save();
    ctx.strokeStyle = 'rgba(210, 200, 160, 0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = n - 1; i >= 1; i--) {
      const seg = snake[i];
      if (i === n - 1) ctx.moveTo(cx(seg), cy(seg));
      else ctx.lineTo(cx(seg), cy(seg));
    }
    ctx.stroke();
    ctx.restore();

    // head
    const head = snake[0];
    const hx = cx(head), hy = cy(head);
    const headAngle = Math.atan2(dir.y, dir.x);
    const hr = CELL * 0.46;

    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(headAngle);

    // tongue (flicks periodically)
    if (Math.floor(frame / 14) % 3 === 0) {
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(hr * 0.9, 0);
      ctx.lineTo(hr * 1.6, 0);
      ctx.moveTo(hr * 1.6, 0);
      ctx.lineTo(hr * 1.9, -3);
      ctx.moveTo(hr * 1.6, 0);
      ctx.lineTo(hr * 1.9, 3);
      ctx.stroke();
    }

    const headGrad = ctx.createRadialGradient(-hr * 0.3, -hr * 0.3, 1, 0, 0, hr * 1.2);
    headGrad.addColorStop(0, 'hsl(112, 45%, 46%)');
    headGrad.addColorStop(1, 'hsl(112, 42%, 24%)');
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, hr * 1.25, hr, 0, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    ctx.fillStyle = '#f4e9c8';
    ctx.beginPath();
    ctx.arc(hr * 0.25, -hr * 0.48, hr * 0.24, 0, Math.PI * 2);
    ctx.arc(hr * 0.25, hr * 0.48, hr * 0.24, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1410';
    ctx.beginPath();
    ctx.arc(hr * 0.4, -hr * 0.48, hr * 0.12, 0, Math.PI * 2);
    ctx.arc(hr * 0.4, hr * 0.48, hr * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    frame++;
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID_X || head.y < 0 || head.y >= GRID_Y || snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (speed > 60) speed -= 3;
      restartLoop();
    } else {
      snake.pop();
    }

    render();
  }

  function restartLoop() {
    clearInterval(loopId);
    loopId = setInterval(step, speed);
  }

  function gameOver() {
    running = false;
    clearInterval(loopId);
    if (score > best) {
      best = score;
      localStorage.setItem('snakepod-best', best);
      bestEl.textContent = best;
    }
    overlayMsg.textContent = `Game over — score ${score}`;
    startBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    resetState();
    running = true;
    paused = false;
    pauseBtn.textContent = '⏸';
    overlay.classList.add('hidden');
    render();
    restartLoop();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearInterval(loopId);
      pauseBtn.textContent = '▶';
      overlayMsg.textContent = 'Paused';
      startBtn.textContent = 'Resume';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      pauseBtn.textContent = '⏸';
      restartLoop();
    }
  }

  function setDirection(d) {
    const opp = { up: 'down', down: 'up', left: 'right', right: 'left' };
    const map = {
      up: {x: 0, y: -1}, down: {x: 0, y: 1}, left: {x: -1, y: 0}, right: {x: 1, y: 0}
    };
    const current = Object.keys(map).find(k => map[k].x === dir.x && map[k].y === dir.y);
    if (opp[d] === current) return;
    nextDir = map[d];
  }

  startBtn.addEventListener('click', () => {
    if (paused) { togglePause(); return; }
    startGame();
  });

  pauseBtn.addEventListener('click', () => {
    if (!running) { startGame(); return; }
    togglePause();
  });

  document.querySelectorAll('.dpad button[data-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
      setDirection(btn.getAttribute('data-dir'));
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 90);
    });
  });

  window.addEventListener('keydown', (e) => {
    const keyDirs = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
    };
    if (keyDirs[e.key]) {
      e.preventDefault();
      if (!running) { startGame(); return; }
      setDirection(keyDirs[e.key]);
    } else if (e.key === ' ') {
      e.preventDefault();
      if (!running) { startGame(); } else { togglePause(); }
    }
  });

  function animLoop() {
    if (running && !paused) render();
    requestAnimationFrame(animLoop);
  }

  resetState();
  render();
  requestAnimationFrame(animLoop);
})();
</script>

</body>
</html>
